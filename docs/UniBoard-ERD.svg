<svg xmlns="http://www.w3.org/2000/svg" width="1410" height="970" viewBox="0 0 1410 970"><rect width="1410" height="970" fill="white"/><g font-family="DejaVu Sans, sans-serif" fill="#111"><text x="40" y="34" font-size="26" font-weight="bold">UniBoard database relationships</text><path d="M195 280 V65 H1205 V220" fill="none" stroke="#555" stroke-width="2"/><text x="260" y="90" font-size="17">1 administrator publishes 0..* notices</text><path d="M350 335 L500 200" fill="none" stroke="#555" stroke-width="2"/><text x="365" y="260" font-size="17">1 → 0..*</text><path d="M350 455 L500 485" fill="none" stroke="#555" stroke-width="2"/><text x="365" y="440" font-size="17">1 → 0..*</text><path d="M350 570 L500 775" fill="none" stroke="#555" stroke-width="2"/><text x="370" y="675" font-size="17">1 → 0..*</text><path d="M1040 305 L830 200" fill="none" stroke="#555" stroke-width="2"/><text x="875" y="235" font-size="17">1 → 0..*</text><path d="M1040 440 L830 485" fill="none" stroke="#555" stroke-width="2"/><text x="880" y="445" font-size="17">1 → 0..*</text><path d="M1040 585 L830 775" fill="none" stroke="#555" stroke-width="2"/><text x="900" y="685" font-size="17">1 → 0..*</text><rect x="40" y="280" width="310" height="350" rx="8" fill="#fafafa" stroke="#333" stroke-width="2"/><rect x="40" y="280" width="310" height="42" rx="8" fill="#ededed"/><path d="M40 322 H350" stroke="#333"/><text x="56" y="308" font-size="21" font-weight="bold">User</text><text x="54" y="348" font-size="17">_id : ObjectId [PK]</text><text x="54" y="375" font-size="17">name : String</text><text x="54" y="402" font-size="17">email : String [unique]</text><text x="54" y="429" font-size="17">password : String [hash]</text><text x="54" y="456" font-size="17">role : admin | student</text><text x="54" y="483" font-size="17">batch : String</text><text x="54" y="510" font-size="17">resetPasswordToken : String?</text><text x="54" y="537" font-size="17">resetPasswordExpires : Date?</text><text x="54" y="564" font-size="17">createdAt / updatedAt : Date</text><rect x="1040" y="220" width="330" height="410" rx="8" fill="#fafafa" stroke="#333" stroke-width="2"/><rect x="1040" y="220" width="330" height="42" rx="8" fill="#ededed"/><path d="M1040 262 H1370" stroke="#333"/><text x="1056" y="248" font-size="21" font-weight="bold">Notice</text><text x="1054" y="288" font-size="17">_id : ObjectId [PK]</text><text x="1054" y="315" font-size="17">createdBy : ObjectId [ref User]</text><text x="1054" y="342" font-size="17">title : String (150)</text><text x="1054" y="369" font-size="17">body : String (10000)</text><text x="1054" y="396" font-size="17">category : String enum</text><text x="1054" y="423" font-size="17">targetBatch : String enum</text><text x="1054" y="450" font-size="17">imageUrl : String?</text><text x="1054" y="477" font-size="17">pdfUrl : String?</text><text x="1054" y="504" font-size="17">pdfName : String (160)</text><text x="1054" y="531" font-size="17">eventDate : Date?</text><text x="1054" y="558" font-size="17">eventLocation : String (160)</text><text x="1054" y="585" font-size="17">createdAt / updatedAt : Date</text><rect x="500" y="100" width="330" height="200" rx="8" fill="#fafafa" stroke="#333" stroke-width="2"/><rect x="500" y="100" width="330" height="42" rx="8" fill="#ededed"/><path d="M500 142 H830" stroke="#333"/><text x="516" y="128" font-size="21" font-weight="bold">Comment</text><text x="514" y="168" font-size="17">_id : ObjectId [PK]</text><text x="514" y="195" font-size="17">noticeId : ObjectId [ref Notice]</text><text x="514" y="222" font-size="17">userId : ObjectId [ref User]</text><text x="514" y="249" font-size="17">body : String (500)</text><text x="514" y="276" font-size="17">createdAt / updatedAt : Date</text><rect x="500" y="390" width="330" height="190" rx="8" fill="#fafafa" stroke="#333" stroke-width="2"/><rect x="500" y="390" width="330" height="42" rx="8" fill="#ededed"/><path d="M500 432 H830" stroke="#333"/><text x="516" y="418" font-size="21" font-weight="bold">SavedNotice</text><text x="514" y="458" font-size="17">_id : ObjectId [PK]</text><text x="514" y="485" font-size="17">noticeId : ObjectId [ref Notice]</text><text x="514" y="512" font-size="17">userId : ObjectId [ref User]</text><text x="514" y="539" font-size="17">createdAt / updatedAt : Date</text><text x="514" y="566" font-size="17">unique (userId, noticeId)</text><rect x="500" y="680" width="330" height="190" rx="8" fill="#fafafa" stroke="#333" stroke-width="2"/><rect x="500" y="680" width="330" height="42" rx="8" fill="#ededed"/><path d="M500 722 H830" stroke="#333"/><text x="516" y="708" font-size="21" font-weight="bold">NoticeRead</text><text x="514" y="748" font-size="17">_id : ObjectId [PK]</text><text x="514" y="775" font-size="17">noticeId : ObjectId [ref Notice]</text><text x="514" y="802" font-size="17">userId : ObjectId [ref User]</text><text x="514" y="829" font-size="17">readAt : Date</text><text x="514" y="856" font-size="17">unique (noticeId, userId)</text><text x="40" y="925" font-size="17">PK = document identity. References are Mongoose ObjectId relationships, not SQL foreign-key constraints.</text><text x="40" y="950" font-size="17">Notice deletion removes related comments, bookmarks and read records. Optional fields are marked ?.</text></g></svg>