<svg xmlns="http://www.w3.org/2000/svg" width="940" height="720" viewBox="0 0 940 720"><rect width="940" height="720" fill="white"/><g font-family="DejaVu Sans,sans-serif" fill="#111"><path d="M135 240 V30 H790 V210" fill="none" stroke="#555" stroke-width="2"/><path d="M255 265 L335 155" fill="none" stroke="#555" stroke-width="2"/><path d="M255 335 L335 375" fill="none" stroke="#555" stroke-width="2"/><path d="M255 405 L335 590" fill="none" stroke="#555" stroke-width="2"/><path d="M665 240 L585 155" fill="none" stroke="#555" stroke-width="2"/><path d="M665 335 L585 375" fill="none" stroke="#555" stroke-width="2"/><path d="M665 430 L585 590" fill="none" stroke="#555" stroke-width="2"/><text x="300" y="23" font-size="18">1 administrator publishes 0..* notices</text><rect x="15" y="240" width="240" height="185" rx="6" fill="#FAFAFA" stroke="#333" stroke-width="2"/><text x="27" y="268" font-size="22" font-weight="bold">User</text><text x="27" y="297" font-size="18">_id : ObjectId PK</text><text x="27" y="323" font-size="18">email : unique String</text><text x="27" y="349" font-size="18">role : String enum</text><text x="27" y="375" font-size="18">batch : String</text><rect x="665" y="210" width="250" height="295" rx="6" fill="#FAFAFA" stroke="#333" stroke-width="2"/><text x="677" y="238" font-size="22" font-weight="bold">Notice</text><text x="677" y="267" font-size="18">_id : ObjectId PK</text><text x="677" y="293" font-size="18">createdBy : ref User</text><text x="677" y="319" font-size="18">title and body : String</text><text x="677" y="345" font-size="18">imageUrl : String</text><text x="677" y="371" font-size="18">pdfUrl : String</text><text x="677" y="397" font-size="18">pdfName : String</text><text x="677" y="423" font-size="18">targetBatch : String</text><text x="677" y="449" font-size="18">eventDate : Date</text><rect x="335" y="80" width="250" height="155" rx="6" fill="#FAFAFA" stroke="#333" stroke-width="2"/><text x="347" y="108" font-size="22" font-weight="bold">Comment</text><text x="347" y="137" font-size="18">_id : ObjectId PK</text><text x="347" y="163" font-size="18">userId : ref User</text><text x="347" y="189" font-size="18">noticeId : ref Notice</text><text x="347" y="215" font-size="18">body : String</text><rect x="335" y="305" width="250" height="140" rx="6" fill="#FAFAFA" stroke="#333" stroke-width="2"/><text x="347" y="333" font-size="22" font-weight="bold">SavedNotice</text><text x="347" y="362" font-size="18">_id : ObjectId PK</text><text x="347" y="388" font-size="18">userId : ref User</text><text x="347" y="414" font-size="18">noticeId : ref Notice</text><rect x="335" y="520" width="250" height="140" rx="6" fill="#FAFAFA" stroke="#333" stroke-width="2"/><text x="347" y="548" font-size="22" font-weight="bold">NoticeRead</text><text x="347" y="577" font-size="18">_id : ObjectId PK</text><text x="347" y="603" font-size="18">userId : ref User</text><text x="347" y="629" font-size="18">noticeId : ref Notice</text><text x="40" y="699" font-size="18">Each user and notice can have zero or many comments, saves and reads.</text></g></svg>